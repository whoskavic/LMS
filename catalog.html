<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse courses | Learnova LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="auth catalog-page">
  <header class="auth-nav">
    <a class="auth-nav__brand" href="catalog.html">
      <span class="brand-logo"><i data-icon="graduation-cap"></i></span>
      <span class="brand-name">Learnova</span>
    </a>
    <p class="auth-nav__tagline">Free courses for everyone</p>
    <div class="catalog-nav">
      <a class="btn btn--outline" href="index.html" id="nav-account">Log in</a>
      <a class="btn btn--primary" href="register.html" id="nav-signup">Sign up</a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode"><i data-icon="moon"></i></button>
    </div>
  </header>

  <main class="content catalog" id="main">
    <!-- Daftar course -->
    <section id="catalog-list-view">
      <section class="page-header">
        <div>
          <p class="page-header__eyebrow">Course catalog</p>
          <h1 class="page-header__title">Learn something new today</h1>
          <p class="page-header__subtitle">Every course is free. Search by topic, then enroll to start learning.</p>
        </div>
      </section>

      <section class="card" aria-label="Search and filters">
        <form class="toolbar" id="catalog-search" role="search">
          <div class="search">
            <i data-icon="search" class="icon--sm"></i>
            <label class="visually-hidden" for="catalog-q">Search courses</label>
            <input class="search__input" id="catalog-q" name="q" type="search" placeholder="Search courses by title or description..." autocomplete="off">
          </div>
          <label class="visually-hidden" for="catalog-category">Category</label>
          <select class="field__input" id="catalog-category" name="category"><option value="">Category: All</option></select>
          <label class="visually-hidden" for="catalog-sort">Sort</label>
          <select class="field__input" id="catalog-sort" name="sort">
            <option value="title">Sort: Title A–Z</option>
            <option value="newest">Sort: Newest</option>
          </select>
        </form>
      </section>

      <p class="text-muted mt-5" id="catalog-summary" aria-live="polite"></p>
      <div class="grid grid--3 mt-5" id="catalog-grid"></div>
      <div class="table-footer">
        <p></p>
        <nav class="pagination" id="catalog-pagination" aria-label="Pagination"></nav>
      </div>
    </section>

    <!-- Detail course -->
    <section id="catalog-detail-view" hidden>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="catalog.html" id="back-to-catalog">Courses</a>
        <span aria-hidden="true">/</span>
        <span id="detail-crumb" aria-current="page">Course</span>
      </nav>
      <div id="catalog-detail"></div>
    </section>
  </main>

  <script src="assets/js/domain.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api/client.js"></script>
  <script src="assets/js/api/transport-http.js"></script>
  <script src="assets/js/api/services.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/catalog.js"></script>
</body>
</html>
