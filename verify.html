<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify certificate | Learnova LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="auth catalog-page">
  <header class="auth-nav">
    <a class="auth-nav__brand" href="catalog.html">
      <span class="brand-logo"><i data-icon="graduation-cap"></i></span>
      <span class="brand-name">Learnova</span>
    </a>
    <p class="auth-nav__tagline">Certificate verification</p>
    <div class="catalog-nav">
      <a class="btn btn--outline" href="catalog.html">Browse courses</a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode"><i data-icon="moon"></i></button>
    </div>
  </header>

  <main class="content catalog" id="main">
    <section class="page-header">
      <div>
        <p class="page-header__eyebrow">Certificates</p>
        <h1 class="page-header__title">Verify a certificate</h1>
        <p class="page-header__subtitle">Enter the certificate number printed at the bottom of a Learnova certificate.</p>
      </div>
    </section>

    <section class="card">
      <form class="toolbar" id="verify-form" novalidate>
        <div class="search">
          <i data-icon="award" class="icon--sm"></i>
          <label class="visually-hidden" for="code">Certificate number</label>
          <input class="search__input" id="code" name="code" type="text" placeholder="e.g. LRN-CS205-ABCDEFGH2345" autocomplete="off">
        </div>
        <button class="btn btn--primary" type="submit" id="verify-submit">Verify</button>
      </form>
    </section>

    <section class="card mt-5" id="verify-result" aria-live="polite" hidden></section>
  </main>

  <script src="assets/js/domain.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api/client.js"></script>
  <script src="assets/js/api/transport-http.js"></script>
  <script src="assets/js/api/services.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Verifikasi publik: GET /certificates/{code}
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("verify-form");
      const input = document.getElementById("code");
      const result = document.getElementById("verify-result");

      async function verify(code) {
        if (!code) return input.focus();
        history.replaceState(null, "", `verify.html?code=${encodeURIComponent(code)}`);
        result.hidden = false;
        await UI.load(result, () => Api.certificates.verify(code), (c) => {
          result.innerHTML = `
            <div class="alert alert--success"><i data-icon="check-circle" class="icon--sm"></i><span>This certificate is valid.</span></div>
            <div class="kv-grid mt-5">
              ${[
                ["Certificate number", c.number],
                ["Awarded to", c.studentName],
                ["Course", [c.course.code, c.course.title].filter(Boolean).join(" · ")],
                ["Instructor", c.course.instructorName],
                ["Date of completion", Utils.formatDate(c.issuedAt, false)],
                ["Final grade", c.grade || "–"],
              ]
                .map(([label, value]) => `<div><p class="kv__label">${label}</p><p class="kv__value">${Utils.escape(value)}</p></div>`)
                .join("")}
            </div>`;
          renderIcons(result);
        });
        // 404 → pesan yang jelas, bukan error teknis
        if (result.querySelector(".state--error")) {
          UI.empty(result, { title: "Certificate not found", text: "Check the number and try again. Numbers look like LRN-CS205-ABCDEFGH2345.", icon: "x-circle" });
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        verify(input.value.trim());
      });
      const initial = new URLSearchParams(location.search).get("code");
      if (initial) {
        input.value = initial;
        verify(initial);
      }
    });
  </script>
</body>
</html>
