<!DOCTYPE html>

<body data-role="student" data-nav-active="student-dashboard.html">

  <div class="app">

      <div class="sidebar__brand">
        <span class="brand-logo"><i data-icon="graduation-cap"></i></span>
        <span class="brand-name">Learnova</span>
        <button class="icon-btn sidebar__close" type="button" data-sidebar-close aria-label="Close menu"><i data-icon="x"></i></button>

      <p class="sidebar__label">Workspace</p>
      <nav aria-label="Main menu">
        <ul class="nav">
          <!-- Admin (operator) -->
          <li data-nav-role="admin"><a class="nav__link" href="dashboard.html"><i data-icon="grid"></i><span>Dashboard</span></a></li>
          <li data-nav-role="admin"><a class="nav__link" href="users.html"><i data-icon="users"></i><span>Users</span></a></li>
          <li data-nav-role="admin"><a class="nav__link" href="data-master.html"><i data-icon="book"></i><span>Courses</span></a></li>
          <li data-nav-role="admin"><a class="nav__link" href="laporan.html"><i data-icon="report"></i><span>Reports</span></a></li>
          <!-- Dosen -->
          <li data-nav-role="lecturer"><a class="nav__link" href="lecturer-dashboard.html"><i data-icon="grid"></i><span>Dashboard</span></a></li>
          <li data-nav-role="lecturer"><a class="nav__link" href="data-master.html"><i data-icon="book"></i><span>My Courses</span></a></li>
          <li data-nav-role="lecturer"><a class="nav__link" href="form.html"><i data-icon="square-plus"></i><span>New Course</span></a></li>
          <!-- Mahasiswa -->
          <li data-nav-role="student"><a class="nav__link" href="student-dashboard.html"><i data-icon="school"></i><span>Dashboard</span></a></li>
          <!-- Semua role -->
          <li data-nav-role="admin lecturer student"><a class="nav__link" href="profile.html"><i data-icon="settings"></i><span>Profile</span></a></li>
        </ul>
      </nav>

      <div class="sidebar__user">
        <span class="avatar avatar--dark" aria-hidden="true" data-avatar></span>
        <div class="user-meta">
          <p class="user-meta__name" data-user-name>User</p>
          <p class="user-meta__role" data-user-title></p>
        </div>
        <button class="icon-btn icon-btn--danger" type="button" data-logout aria-label="Sign out" title="Sign out"><i data-icon="logout"></i></button>
      </div>
    </aside>

    <div class="overlay" data-sidebar-close></div>

    <!-- ============ AREA UTAMA ============ -->
    <div class="main">

      <header class="topbar">
        <button class="icon-btn topbar__menu" type="button" data-sidebar-open aria-controls="sidebar" aria-expanded="false" aria-label="Open menu"><i data-icon="menu"></i></button>

        <form class="search" role="search">
          <i data-icon="search" class="icon--sm"></i>
          <label class="visually-hidden" for="global-search">Search</label>
          <input class="search__input" id="global-search" type="search" placeholder="Search courses, students, or reports..." autocomplete="off">
        </form>

        <div class="topbar__actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode"><i data-icon="moon"></i></button>
          <div class="dropdown">
            <button class="icon-btn" type="button" data-dropdown-toggle aria-haspopup="true" aria-expanded="false" aria-label="Notifications"><i data-icon="bell"></i><span class="dot"></span></button>
            <div class="dropdown__menu" hidden>
              <p class="dropdown__title">Notifications</p>
              <ul data-notifications></ul>
            </div>
          </div>
          <span class="topbar__user" data-user-name>User</span>
