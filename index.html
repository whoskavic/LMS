<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Learnova LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="auth">
  <div class="auth__toolbar">
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode"><i data-icon="moon"></i></button>
  </div>

  <main class="auth__card card">
    <div class="auth__brand">
      <span class="brand-logo"><i data-icon="graduation-cap"></i></span>
      <span class="brand-name">Learnova</span>
    </div>

    <header class="auth__header">
      <h1 class="page-header__title">Welcome back</h1>
      <p class="page-header__subtitle">Sign in with your Learnova account</p>
    </header>

    <form class="form-stack" id="login-form" novalidate>
      <div class="alert alert--danger" id="login-alert" role="alert" hidden>
        <i data-icon="alert" class="icon--sm"></i>
        <span id="login-alert-text">Email or password is incorrect.</span>
      </div>

      <div class="field" data-field="email">
        <label class="field__label" for="email">Email</label>
        <input class="field__input" id="email" name="email" type="email" placeholder="name@learnova.ac.id" autocomplete="email" aria-describedby="email-error">
        <p class="field__error" id="email-error"><i data-icon="alert" class="icon--sm"></i><span></span></p>
      </div>

      <div class="field" data-field="password">
        <label class="field__label" for="password">Password</label>
        <div class="input-group">
          <input class="field__input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" aria-describedby="password-error">
          <button class="icon-btn input-group__btn" type="button" data-toggle-password aria-label="Show password"><i data-icon="eye" class="icon--sm"></i></button>
        </div>
        <p class="field__error" id="password-error"><i data-icon="alert" class="icon--sm"></i><span></span></p>
      </div>

      <button class="btn btn--primary btn--block" type="submit">Sign in</button>
    </form>

    <section class="auth__demo" aria-label="Demo accounts">
      <p class="auth__demo-title">Demo accounts · click to fill</p>
      <button class="demo-account" type="button" data-email="admin@learnova.ac.id" data-password="admin123">
        <span><span class="demo-account__email">admin@learnova.ac.id</span><br><span class="text-muted">admin123</span></span>
        <span class="badge badge--primary">Admin</span>
      </button>
      <button class="demo-account" type="button" data-email="budi@learnova.ac.id" data-password="dosen123">
        <span><span class="demo-account__email">budi@learnova.ac.id</span><br><span class="text-muted">dosen123</span></span>
        <span class="badge badge--warning">Lecturer</span>
      </button>
      <button class="demo-account" type="button" data-email="alex@learnova.ac.id" data-password="student123">
        <span><span class="demo-account__email">alex@learnova.ac.id</span><br><span class="text-muted">student123</span></span>
        <span class="badge badge--success">Student</span>
      </button>
    </section>

    <p class="auth__reset"><button class="btn btn--link" type="button" id="reset-demo">Reset demo data</button></p>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
