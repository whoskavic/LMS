<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Learnova LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="auth">
  <!-- Header -->
  <header class="auth-nav">
    <a class="auth-nav__brand" href="index.html">
      <span class="brand-logo"><i data-icon="graduation-cap"></i></span>
      <span class="brand-name">Learnova</span>
    </a>
    <p class="auth-nav__tagline">Learning Management System</p>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode"><i data-icon="moon"></i></button>
  </header>

  <main class="auth__layout">
    <div class="auth__art">
      <img src="assets/img/login-illustration.webp" alt="" width="640" height="720">
    </div>

    <section class="auth__panel" aria-labelledby="login-title">
      <h1 class="auth__title" id="login-title">Log in to continue your learning journey</h1>

      <form class="form-stack" id="login-form" novalidate>
        <div class="alert alert--danger" id="login-alert" role="alert" hidden>
          <i data-icon="alert" class="icon--sm"></i>
          <span id="login-alert-text">Email or password is incorrect.</span>
        </div>

        <!-- Langkah 1: email -->
        <div class="field" data-field="email" data-step="email">
          <div class="float-field">
            <input class="field__input" id="email" name="email" type="email" placeholder=" " autocomplete="email" aria-describedby="email-error">
            <label for="email">Email</label>
          </div>
          <p class="field__error" id="email-error"><i data-icon="alert" class="icon--sm"></i><span></span></p>
        </div>

        <!-- Langkah 2: password -->
        <div class="auth__account" data-step="password" hidden>
          <span class="auth__account-email" id="account-email"></span>
          <button class="btn btn--link" type="button" id="change-email">Change</button>
        </div>
        <div class="field" data-field="password" data-step="password" hidden>
          <div class="float-field input-group">
            <input class="field__input" id="password" name="password" type="password" placeholder=" " autocomplete="current-password" aria-describedby="password-error">
            <label for="password">Password</label>
            <button class="icon-btn input-group__btn" type="button" data-toggle-password aria-label="Show password"><i data-icon="eye" class="icon--sm"></i></button>
          </div>
          <p class="field__error" id="password-error"><i data-icon="alert" class="icon--sm"></i><span></span></p>
        </div>

        <button class="btn btn--primary btn--block auth__submit" type="submit" id="login-submit">Continue</button>
      </form>

      <section class="auth__demo" aria-labelledby="demo-title">
        <p class="auth__divider" id="demo-title"><span>Demo accounts · click to fill</span></p>
        <button class="demo-account" type="button" data-email="admin@learnova.ac.id" data-password="admin123">
          <span><span class="demo-account__email">admin@learnova.ac.id</span><br><span class="text-muted">admin123</span></span>
          <span class="badge badge--primary">Admin</span>
        </button>
        <button class="demo-account" type="button" data-email="budi@learnova.ac.id" data-password="dosen123">
          <span><span class="demo-account__email">budi@learnova.ac.id</span><br><span class="text-muted">dosen123</span></span>
          <span class="badge badge--warning">Instructor</span>
        </button>
        <button class="demo-account" type="button" data-email="alex@learnova.ac.id" data-password="student123">
          <span><span class="demo-account__email">alex@learnova.ac.id</span><br><span class="text-muted">student123</span></span>
          <span class="badge badge--success">Student</span>
        </button>
      </section>

      <div class="auth__box">
        <p>Don't have an account? <a class="btn btn--link" href="register.html" data-keep-next>Sign up</a></p>
        <p>Just looking? <a class="btn btn--link" href="catalog.html">Browse free courses</a></p>
        <p data-mock-only><button class="btn btn--link" type="button" id="reset-demo">Reset demo data</button></p>
      </div>
    </section>
  </main>
  <script src="assets/js/domain.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api/client.js"></script>
  <script src="assets/js/api/transport-http.js"></script>
  <script src="assets/js/api/services.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
