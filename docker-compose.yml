services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnova
      POSTGRES_PASSWORD: learnova
      POSTGRES_DB: learnova
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnova -d learnova"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://learnova:learnova@db:5432/learnova
      TEST_DATABASE_URL: postgresql+psycopg://learnova:learnova@db:5432/learnova_test
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
