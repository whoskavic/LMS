name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test
        run: node --test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learnova
          POSTGRES_PASSWORD: learnova
          POSTGRES_DB: learnova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnova"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://learnova:learnova@localhost:5432/learnova
      TEST_DATABASE_URL: postgresql+psycopg://learnova:learnova@localhost:5432/learnova_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Alembic upgrade head (database kosong)
        run: alembic upgrade head && alembic check
      - name: Pytest
        run: pytest
