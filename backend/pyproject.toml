[project]
name = "learnova-backend"
version = "0.1.0"
description = "Learnova LMS — FastAPI backend"
requires-python = ">=3.12"
# Sama persis dengan requirements.txt (Vercel bisa membaca salah satunya)
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "PyJWT==2.15.1",
    "argon2-cffi==25.1.0",
]

# Vercel menjalankan perintah ini saat build (setelah dependency terpasang): migrasi + seed opsional
[tool.vercel.scripts]
build = "python vercel_build.py"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
